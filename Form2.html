<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body bgcolor="#f4f6f9" text="#34495e">

    <br><br>

    <table width="440" align="center" bgcolor="#ffffff" cellpadding="25" cellspacing="0" border="1">
        <tr>
            <td>

                <h2><font face="Arial, sans-serif" color="#2c3e50">Student Application Form</font></h2>
                <hr color="#3498db" size="2" align="left" width="100%">
                <br>

                <form action="/submit" method="POST" enctype="multipart/form-data">

                    <input type="hidden" name="form_version" value="2.0">

                    <table width="100%" cellpadding="5" cellspacing="0" border="0">
                        
                        <tr>
                            <td>
                                <label for="uname"><b><font face="Arial, sans-serif" size="2">Username:</font></b></label><br>
                                <input type="text" id="uname" name="username" placeholder="Enter username" required size="45">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>
                                <label for="pass"><b><font face="Arial, sans-serif" size="2">Password:</font></b></label><br>
                                <input type="password" id="pass" name="password" placeholder="Enter password" required size="45">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>
                                <label><b><font face="Arial, sans-serif" size="2">Gender:</font></b></label><br>
                                <font face="Arial, sans-serif" size="2">
                                    <input type="radio" id="m" name="gender" value="male"> <label for="m">Male</label> &nbsp;&nbsp;
                                    <input type="radio" id="f" name="gender" value="female"> <label for="f">Female</label>
                                </font>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>
                                <label><b><font face="Arial, sans-serif" size="2">Skills:</font></b></label><br>
                                <font face="Arial, sans-serif" size="2">
                                    <input type="checkbox" id="s1" name="skills" value="html"> <label for="s1">HTML</label> &nbsp;&nbsp;
                                    <input type="checkbox" id="s2" name="skills" value="css"> <label for="s2">CSS</label>
                                </font>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>
                                <label for="dept"><b><font face="Arial, sans-serif" size="2">Department:</font></b></label><br>
                                <select id="dept" name="department">
                                    <option value="it">Information Technology</option>
                                    <option value="cs">Computer Science</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <br>
                                <label for="photo"><b><font face="Arial, sans-serif" size="2">Upload ID Photo:</font></b></label><br>
                                <input type="file" id="photo" name="id_photo" accept="image/*">
                            </td>
                        </tr>

                        <tr>
                            <table border="1" cellpadding="8" cellspacing="0" bgcolor="#fafafa">
                                <tr>
                                    <td>
                                        <label for="bio"><b><font face="Arial" size="2">Short Bio:</font></b></label><br>
                                        <input type="text" id="bio" name="bio" placeholder="Tell us about yourself..." size="42">
                                    </td>
                                </tr>
                            </table>
                        </tr>

                        <tr>
                            <td align="center">
                                <br><br>
                                <input type="submit" value="Submit">
                                &nbsp;&nbsp;&nbsp;&nbsp;
                                <input type="reset" value="Clear">
                            </td>
                        </tr>

                    </table>

                </form>

            </td>
        </tr>
    </table>

    <br><br>

</body>
</html>
